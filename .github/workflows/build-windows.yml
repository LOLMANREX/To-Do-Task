name: Build Windows App (.EXE)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'TO-Do Win/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'TO-Do Win/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publier automatiquement une GitHub Release avec le fichier setup .exe'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilation de l'exécutable Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            TO-Do Win/package-lock.json
            TO-Do Win/frontend/package-lock.json

      - name: Installer les dépendances du Frontend
        working-directory: 'TO-Do Win/frontend'
        run: npm ci

      - name: Compiler le Frontend (Vite)
        working-directory: 'TO-Do Win/frontend'
        run: npm run build

      - name: Installer les dépendances Electron & Backend
        working-directory: 'TO-Do Win'
        run: npm ci

      - name: Compiler le package installateur Windows (.exe NSIS)
        working-directory: 'TO-Do Win'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Téléverser l'installateur Windows comme Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: To-Do-Task-Win-Installation
          path: |
            TO-Do Win/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier sur GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TO-Do Win/dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
